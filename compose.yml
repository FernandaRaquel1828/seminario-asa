version: '3.8'

services:
  app1:
    build: ./app1
    container_name: app1
    networks:
      - proxy-net

  app2:
    build: ./app2
    container_name: app2
    networks:
      - proxy-net

  proxy:
    image: nginx:alpine
    container_name: proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app1
      - app2
    networks:
      - proxy-net

networks:
  proxy-net: